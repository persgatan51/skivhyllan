name: Bygg Android-app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Bygg APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Lägg upp APK som nedladdning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk skivhyllan.apk
          if gh release view app >/dev/null 2>&1; then
            gh release upload app skivhyllan.apk --clobber
          else
            gh release create app skivhyllan.apk --title "Android-app" \
              --notes "Senaste versionen av appen. Ladda ner skivhyllan.apk på telefonen och installera."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: skivhyllan-apk
          path: skivhyllan.apk
